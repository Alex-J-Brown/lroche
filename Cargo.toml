[package]
name = "lcurve"
version = "0.4.4"
edition = "2024"

[lib]
name = "lcurve"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16.1"
bulirsch = "0.1.12"
numpy = "0.28.0"
rayon = "1.10"
png = "0.18"
gif = "0.13"
serde_json = "1.0.149"
serde-pyobject = "0.8.0"
roche-rs = "0.5.3"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.pyo3]
version = "0.28.2"
features = ["abi3-py38"]

[profile.release]
debug=true